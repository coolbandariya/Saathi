name: Frontend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'test/**', 'chore/**']
  pull_request:
    branches: ['**']

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
